name: Android build and tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate catalog
        shell: pwsh
        run: ./scripts/validate-apps-json.ps1
      - name: Build APK, compile instrumentation tests, run unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :launcher:assembleDebug :launcher:assembleDebugAndroidTest :launcher:testDebugUnitTest :launcher:lintDebug --console=plain
          python3 -m unittest discover -s scripts -p 'test_sync*catalog.py' -v
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ezch-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            launcher/app/build/outputs/apk/debug/*.apk
            launcher/app/build/reports/tests/testDebugUnitTest/
            launcher/app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  android-tv-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: android-tv
          - api: 33
            target: google-tv
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK and prepare Gradle
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual TV UI and archive signatures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest :launcher:connectedDebugAndroidTest --console=plain
      - name: Verify tests really executed
        shell: pwsh
        run: |
          ./scripts/verify-android-test-results.ps1 -MinimumTests 20
          ./scripts/verify-android-test-results.ps1 -Directory ./launcher/app/build/outputs/androidTest-results/connected/debug -MinimumTests 25
      - name: Save Android test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-tv-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            launcher/app/build/reports/androidTests/
            launcher/app/build/outputs/androidTest-results/
          if-no-files-found: warn
