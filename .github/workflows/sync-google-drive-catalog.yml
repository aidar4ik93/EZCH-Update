name: Sync application catalog from Google Drive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Verify synchronization behavior
        run: python3 -m unittest discover -s scripts -p 'test_sync*catalog.py' -v
      - name: Prepare Android SDK build tools
        shell: bash
        run: |
          sdkmanager 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
      - name: Synchronize and verify the complete public folder
        run: |
          python3 scripts/sync-google-drive-catalog.py --sdk "$ANDROID_HOME" --keep-project-releases
          cp apps.json app/src/main/assets/apps.json
          cp apps.json launcher/app/src/main/assets/apps.json
      - name: Validate generated catalog
        shell: pwsh
        run: ./scripts/validate-apps-json.ps1
      - name: Commit catalog only when it changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- apps.json app/src/main/assets/apps.json launcher/app/src/main/assets/apps.json; then
            echo 'Catalog is unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps.json app/src/main/assets/apps.json launcher/app/src/main/assets/apps.json
          git commit -m 'Update Google Drive application catalog'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
