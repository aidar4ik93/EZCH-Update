name: Sync application catalog from Yandex Disk

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify synchronization behavior
        run: python3 -m unittest discover -s scripts -p 'test_sync_yandex_catalog.py' -v
      - name: Prepare Android SDK build tools
        shell: bash
        run: |
          sdkmanager 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
      - name: Restore verified APK cache
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: .local/yandex-catalog-cache
          key: yandex-apks-v1-${{ runner.os }}-${{ hashFiles('apps.json', 'scripts/sync-yandex-catalog.py') }}
          restore-keys: |
            yandex-apks-v1-${{ runner.os }}-
      - name: Synchronize and verify the complete public folder
        run: |
          python3 scripts/sync-yandex-catalog.py --sdk "$ANDROID_HOME" --keep-project-releases
          cp apps.json app/src/main/assets/apps.json
          cp apps.json launcher/app/src/main/assets/apps.json
      - name: Validate generated catalog
        shell: pwsh
        run: ./scripts/validate-apps-json.ps1
      - name: Save verified APK cache
        if: steps.apk-cache.outputs.cache-matched-key != format('yandex-apks-v1-{0}-{1}', runner.os, hashFiles('apps.json', 'scripts/sync-yandex-catalog.py'))
        uses: actions/cache/save@v4
        with:
          path: .local/yandex-catalog-cache
          key: yandex-apks-v1-${{ runner.os }}-${{ hashFiles('apps.json', 'scripts/sync-yandex-catalog.py') }}
      - name: Commit catalog only when it changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- apps.json app/src/main/assets/apps.json launcher/app/src/main/assets/apps.json; then
            echo 'Catalog is unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps.json app/src/main/assets/apps.json launcher/app/src/main/assets/apps.json
          git commit -m 'Update Yandex Disk application catalog'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
